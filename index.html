<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 화면 비율 고정 및 터치 확대 방지 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>비 오는 날의 우산 러너</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* 터치 시 텍스트 드래그 방지 */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background-color: #1a1a24;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
      font-family: monospace;
      overflow: hidden; /* 스크롤 방지 */
    }
    #gameContainer {
      text-align: center;
      width: 100%;
      max-width: 600px;
      padding: 10px;
    }
    canvas {
      width: 100%; /* 모바일 화면에 맞춰 자동으로 커짐 */
      height: auto;
      border: 4px solid #4a4e69;
      background-color: #2b2d42;
      image-rendering: pixelated; 
      image-rendering: crisp-edges;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      touch-action: manipulation; /* 기본 터치 동작 제한 */
    }
    p {
      margin-top: 12px;
      color: #a0a0b0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="320" height="180"></canvas>
    <p>화면 터치 / [Space] 키로 점프하세요</p>
  </div>
  <script src="game.js"></script>
</body>
</html>

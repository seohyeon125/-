<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? - 픽셀 날씨 메뉴 추천기</title>
  <!-- 레트로 픽셀 느낌을 위한 픽셀 폰트 (DungGeunMo) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff" format="woff">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pixel-card">
    <!-- 헤더 영역 -->
    <header>
      <h1 class="pixel-title">🍳오늘 뭐 먹지?</h1>
      <p class="subtitle">날씨 맞춤 픽셀 메뉴 추천기</p>
    </header>

    <!-- 날씨 정보 영역 -->
    <section class="weather-box">
      <div class="pixel-badge">TODAY'S WEATHER</div>
      <div id="weather-info">
        <span id="weather-icon">⏳</span>
        <div class="weather-text">
          <p id="weather-desc">날씨를 확인하는 중...</p>
          <p id="temp-desc">-°C</p>
        </div>
      </div>
    </section>

    <!-- 메뉴 결과 표시 영역 -->
    <section class="result-box">
      <div class="image-wrapper">
        <img id="menu-img" src="https://api.iconify.design/pixelarticons:gift.svg?color=%23d97706" alt="메뉴 픽셀 아이콘" />
      </div>
      <h2 id="menu-name">버튼을 눌러주세요!</h2>
      <p id="recommend-reason" class="reason-text">오늘 날씨에 딱 맞는 음식을 추천해드려요.</p>
    </section>

    <!-- 버튼 영역 -->
    <button id="recommend-btn" class="pixel-btn">
      <span class="btn-text">🎲 메뉴 추천받기</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>

<!-- 메뉴 추가 폼 (기본 hidden) -->
    <section id="add-menu-form" class="add-form-box hidden">
      <h3 class="form-title">📝 새 메뉴 등록</h3>
      
      <div class="input-group">
        <label for="new-menu-name">메뉴 이름</label>
        <input type="text" id="new-menu-name" placeholder="예: 불고기 덮밥" maxlength="15">
      </div>

      <div class="input-group">
        <label for="new-menu-reason">추천 이유</label>
        <input type="text" id="new-menu-reason" placeholder="예: 단짠의 정석 밥도둑!" maxlength="30">
      </div>

      <div class="input-group">
        <label for="new-menu-weather">어울리는 날씨</label>
        <select id="new-menu-weather">
          <option value="General">아무 때나 전부 좋아</option>
          <option value="Clear">맑고 기분 좋은 날</option>
          <option value="Rain">비 오거나 축축한 날</option>
          <option value="Cold">쌀쌀하고 추운 날</option>
          <option value="Hot">무더운 찌는 날</option>
        </select>
      </div>

      <button id="save-menu-btn" class="pixel-btn save-style">
        💾 메뉴 저장하기
      </button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>

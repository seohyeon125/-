<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>간단한 숫자 맞추기 게임</title>
    <style>
        body { text-align: center; font-family: sans-serif; margin-top: 50px; }
        input { padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>1부터 100 사이의 숫자 맞추기!</h1>
    <p>컴퓨터가 생각한 숫자를 맞춰보세요.</p>
    <input type="number" id="guess" min="1" max="100">
    <button onclick="checkGuess()">정답 확인</button>
    <p id="result"></p>

    <script>
        // 1부터 100 사이의 랜덤 숫자 생성
        const answer = Math.floor(Math.random() * 100) + 1;

        function checkGuess() {
            const userGuess = document.getElementById("guess").value;
            const resultElement = document.getElementById("result");

            if (userGuess == answer) {
                resultElement.innerText = "🎉 축하합니다! 정답입니다!";
                resultElement.style.color = "green";
            } else if (userGuess > answer) {
                resultElement.innerText = "📉 너무 커요! 더 낮은 숫자를 입력하세요.";
                resultElement.style.color = "blue";
            } else {
                resultElement.innerText = "📈 너무 작아요! 더 높은 숫자를 입력하세요.";
                resultElement.style.color = "red";
            }
        }
    </script>
</body>
</html>
